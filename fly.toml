# Fly.io configuration for Telegram Puzzle Bot
app = "telegram-puzzle-bot"
primary_region = "ams"

# Build configuration
[build]
  dockerfile = "Dockerfile"

# Run configuration
[processes]
  app = "python main.py"

[env]
  TZ = "Europe/Amsterdam"

# Persistent storage for database
[[mounts]]
  source = "puzzle_data"
  destination = "/app/data"
